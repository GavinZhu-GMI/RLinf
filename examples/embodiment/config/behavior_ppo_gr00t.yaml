defaults:
  - env/behavior_r1pro@env.train
  - env/behavior_r1pro@env.eval
  - model/gr00t@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0
    env,rollout: 1-1

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "behavior_ppo_gr00t_n1d6"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 40
  seq_length: 4096
  max_prompt_length: 50

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  rollout_epoch: 8
  eval_rollout_epoch: 1

  # chunk_level: aggregate log-probs/entropy over entire action chunk
  # more stable than token_level for multi-step action predictions
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level

  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0.01    # small entropy bonus to prevent premature convergence
  clip_ratio_high: 0.2   # standard PPO clipping (tighter than 0.28)
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 1
    # turning_on_radio BEHAVIOR timeout is ~4299 steps (2x human demo mean)
    # 4500 provides a safe cap above that
    max_episode_steps: 4500
    max_steps_per_rollout_epoch: 4500
  eval:
    total_num_envs: 1
    max_episode_steps: 4500
    max_steps_per_rollout_epoch: 4500
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: "/path/to/checkpoints/GR00T-N1.6-BEHAVIOR1k"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 8
  seed: 1234
  enable_offload: True

  model:
    model_path: "/path/to/checkpoints/GR00T-N1.6-BEHAVIOR1k"
    model_version: "n1.6"
    action_dim: 23              # BEHAVIOR: base(3)+torso(4)+arms(14)+grippers(2)
    num_action_chunks: 8        # execute 8 of 32 predicted steps (matches eval n_action_steps=8)
    denoising_steps: 4          # flow matching denoising iterations
    obs_converter_type: "behavior"
    embodiment_tag: "behavior_r1_pro"
    add_value_head: True

    rl_head_config:
      joint_logprob: False
      noise_method: "flow_sde"
      ignore_last: False
      safe_get_logprob: False
      noise_anneal: False
      noise_params: [0.7, 0.3, 400]
      noise_level: 0.3          # lower noise — pretrained policy already at 66.7%
      add_value_head: ${actor.model.add_value_head}
      chunk_critic_input: False
      detach_critic_input: True
      disable_dropout: True
      use_vlm_value: False
      value_vlm_mode: "mean_token"
      padding_value: 570

  optim:
    lr: 2.0e-5                  # conservative — prevents gradient explosion
    value_lr: 2.0e-5            # same as policy lr — value head trains stably
    adam_beta1: 0.9
    adam_beta2: 0.95            # more aggressive decay for noisy RL gradients
    adam_eps: 1.0e-08
    clip_grad: 1.0              # tight gradient clipping — critical for stability
    weight_decay: 0.01
    critic_warmup_steps: 10     # warm up value head before using for advantage

  fsdp_config:
    # FSDP2 handles mixed requires_grad + single-GPU (NO_SHARD) properly.
    # FSDP1 with use_orig_params=True crashes on writeback with world_size=1.
    strategy: "fsdp2"
    gradient_checkpointing: True
    use_orig_params: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
