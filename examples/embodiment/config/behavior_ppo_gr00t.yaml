defaults:
  - env/behavior_r1pro@env.train
  - env/behavior_r1pro@env.eval
  - model/gr00t@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-3

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "behavior_ppo_gr00t_n1d6"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 40
  seq_length: 4096
  max_prompt_length: 50

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  # Buffer = num_envs * rollout_epoch trajectories per PPO step.
  # Dropped 8 -> 2 to keep first PPO step under ~10 min wall (was 1h46m).
  rollout_epoch: 2
  eval_rollout_epoch: 1

  # chunk_level: aggregate log-probs/entropy over entire action chunk
  # more stable than token_level for multi-step action predictions
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level

  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  # KL anchor to the frozen reference GR00T policy. Pulls the trainable
  # actor back toward the BC-pretrained behavior distribution. Enables
  # the standard VLA-RL recipe of trusting the demo prior encoded in the
  # base model. Loads the reference policy in fsdp_actor_worker.py:168-215
  # whenever > 0.
  kl_beta: 0.01
  entropy_bonus: 0       # disabled until entropy computation is implemented
  clip_ratio_high: 0.2   # standard PPO clipping (tighter than 0.28)
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    # 8 envs across 4 GPUs (2 vectorized per Isaac Sim via VectorEnvironment).
    # Bug 1 (Eagle VLM shape mismatch input_embeds[243] vs vit_embeds[486])
    # is handled by Isaac-GR00T's existing try/except in
    # modeling_eagle3_vl.py:253 — silently truncates, non-fatal.
    # Bug 2 (metric aggregation TypeError from list-not-tensor) is fixed
    # in metric_utils.py:compute_evaluate_metrics.
    total_num_envs: 8
    # ~2000 steps = ~67s of physics @ 30Hz. Long enough that a learned
    # policy can actually complete turning_on_radio (~1000 env steps for
    # a trained GR00T) without truncation, while ~2.25x faster than the
    # canonical BEHAVIOR challenge horizon (4320 = 2x human demo mean).
    # Iter 2-3 had 500 which was structurally unsolvable (radio is ~2m
    # away at start, takes >16s of physics to approach + press).
    max_episode_steps: 2000
    # Two divisibility constraints on max_steps_per_rollout_epoch:
    #   1. % num_action_chunks(=8) == 0  (rlinf/config.py:822-828)
    #   2. rollout_size_per_rank % batch_size_per_rank == 0
    #      (rlinf/workers/actor/fsdp_actor_worker.py:1338)
    # For total_num_envs=8, rollout_epoch=2, world_size=4 actor ranks,
    # batch_size_per_rank=8: rollout_size_per_rank = (8*2*N)/(8*4) = N/2
    # so we need N/2 % 8 == 0, i.e. N % 16 == 0.
    # 2016 = 126×16 is the smallest valid N >= max_episode_steps=2000.
    max_steps_per_rollout_epoch: 2016
  eval:
    total_num_envs: 8
    max_episode_steps: 2000
    max_steps_per_rollout_epoch: 2016
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: "/path/to/checkpoints/GR00T-N1.6-BEHAVIOR1k"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  # PPO minibatch size for the optimizer step (NOT the buffer size).
  # batch_size_per_rank = global_batch_size / world_size = 32 / 4 = 8
  # chunks per GPU per gradient step. Iter 2 mistakenly shrank this
  # 32 -> 8 thinking it tracked the buffer; it actually controls
  # gradient noise per optimizer step. Restored to 32 (iter 1 value)
  # for stable PPO updates.
  global_batch_size: 32
  seed: 1234
  enable_offload: True

  model:
    model_path: "/path/to/checkpoints/GR00T-N1.6-BEHAVIOR1k"
    model_version: "n1.6"
    action_dim: 23              # BEHAVIOR: base(3)+torso(4)+arms(14)+grippers(2)
    num_action_chunks: 8        # execute 8 of 32 predicted steps (matches eval n_action_steps=8)
    denoising_steps: 4          # flow matching denoising iterations
    obs_converter_type: "behavior"
    embodiment_tag: "behavior_r1_pro"
    add_value_head: True

    rl_head_config:
      joint_logprob: False
      noise_method: "flow_sde"
      ignore_last: False
      safe_get_logprob: False
      noise_anneal: False
      noise_params: [0.7, 0.3, 400]
      noise_level: 0.5          # needed for log-prob stability + exploration (0.0 breaks PPO ratio)
      add_value_head: ${actor.model.add_value_head}
      chunk_critic_input: False
      detach_critic_input: True
      disable_dropout: True
      use_vlm_value: False
      value_vlm_mode: "mean_token"
      padding_value: 570

  optim:
    lr: 2.0e-5                  # conservative — prevents gradient explosion
    # Value head is randomly initialized (not warm-started from BC). With
    # value_lr matched to policy_lr it falls behind the moving return
    # distribution — observed in iter 1 as explained_variance=NaN and
    # value_loss rising 0.075 -> 0.140 over 8 PPO steps. Bump to give
    # the critic 5x faster updates.
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95            # more aggressive decay for noisy RL gradients
    adam_eps: 1.0e-08
    clip_grad: 1.0              # tight gradient clipping — critical for stability
    weight_decay: 0.01
    # 10 was far too few for a randomly-init value head. With 300 steps of
    # critic-only updates before policy gradients kick in, the critic gets
    # to fit early returns before the actor moves the distribution.
    critic_warmup_steps: 300

  fsdp_config:
    # FSDP2 handles mixed requires_grad + single-GPU (NO_SHARD) properly.
    # FSDP1 with use_orig_params=True crashes on writeback with world_size=1.
    strategy: "fsdp2"
    gradient_checkpointing: True
    use_orig_params: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
